apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api-deployment
  namespace: grade-submission
  labels:
    app.kubernetes.io/type: ui
spec:
  replicas: 2 # specify the desired number of running pods 
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-submission-api
  # Template is structure of the pods that are gonna be replicated and managed bt=y K8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-sumbission
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: grade-submission-api
    spec:
      containers:
      - name: grade-submission-api
        image: rslim087/kubernetes-course-grade-submission-api:stateless-v3
        livenessProbe:
          httpGet: 
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 5
        envFrom:
          - configMapRef:
              name: grade-submission-api-config
          - secretRef:
              name: grade-submission-api-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "128m"
          limits:
            memory: "128Mi"
        ports:
         - containerPort: 3000

