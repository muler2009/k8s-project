apiVersion: v1
# What type of object are we are creating?
kind: Pod  
# metadata contains information about the Kubernetes object. It does not describe the container itself.
metadata: 
  # metadata.name is used ot define the name of the Pod.
  name: grade-sumbission-portal
  # metadata.labels - > A label is a key-value pair attached to a Kubernetes object.
  # Labels are mainly used to identify, organize, and select resources.
  # app.kubernetes.io is labeling convention in kubernettes
  labels:
    app.kubernetes.io/name: grade-sumbission
    # app.kubernetes.io/component -> used to define the role of the application
    app.kubernetes.io/component: frontend  
    # app.kubernetes.io/instance =>  identifies a specific instance or installation of an application.
    app.kubernetes.io/instance: grade-submission-portal
# Specification/spec a run-time configuration , What should Kubernetes actually run?, what specification for running container in pod
spec:
  containers:
  - name: grade-submission-portal
    image: rslim087/kubernetes-course-grade-submission-portal
    # When we have got the running processs we need to allocate necessary amount of resource for the process to run properly, 
    # So we need the define the resources via "resources"
    env:
      - name: GRADE_SERVICE_HOST
        value: grade-submission-api
    resources:
      # requests is used to define the minimuim amount of memeory and cpu required for the application to function properly
      requests:
        memory: "128Mi" # this is our workspace computers store and retrive date for processing 
        cpu: "200m"     # computation performer
      limits:
        memory: "128Mi"
    ports:
      - containerPort: 5001
 
  
