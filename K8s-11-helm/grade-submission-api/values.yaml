microservice:
  name: grade-submission-api
  namespace: grade-submission
  replicas: 2

# container related configurations defined here 
workload:   
  image: rslim087/kubernetes-course-grade-submission-api:stateless-v3
  port: 3000
  resources: 
    memory: "128Mi"
    cpu: "128m"
  livenessDelay: 15
  livenessPeriod: 5

# enviroment variables for the microservice defined here
env:
  MONGODB_HOST: mongodb-service
  MONGODB_PORT: '27017'

# sensetive data for the microservice defined here
secret:
  MONGODB_USER: 'YWRtaW4='
  MONGODB_PASSWORD: 'cGFzc3dvcmQxMjM='
