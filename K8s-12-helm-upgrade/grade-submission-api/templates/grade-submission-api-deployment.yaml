apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api-deployment
  namespace: {{ .Values.microservice.namespace}}
  labels:
    app.kubernetes.io/type: ui
spec:
  replicas: {{ .Values.microservice.replicas}} # specify the desired number of running pods 
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name}}
  # Template is structure of the pods that are gonna be replicated and managed bt=y K8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-sumbission
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Values.microservice.name}}
    spec:
      containers:
      - name: {{ .Values.microservice.name}}
        image: {{ .Values.workload.image}}
        livenessProbe:
          httpGet: 
            path: /healthz
            port: {{ .Values.workload.port}}
          initialDelaySeconds: {{ .Values.workload.livenessDelay}}
          periodSeconds: {{ .Values.workload.livenessPeriod}}
        readinessProbe:
          httpGet: 
            path: /readyz
            port: {{ .Values.workload.port}}
        envFrom:
          - secretRef:
              name: {{ .Values.microservice.name}}-secret
        resources:
          requests:
            memory: {{ .Values.workload.resources.memory}}
            cpu: {{ .Values.workload.resources.cpu}}
          limits:
            memory: {{ .Values.workload.resources.memory}}
        ports:
         - containerPort: {{ .Values.workload.port}}

