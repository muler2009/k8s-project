microservice:
  name: grade-submission-api
  namespace: grade-submission
  replicas: 2

# container related configurations defined here 
workload:   
  image: rslim087/kubernetes-course-grade-submission-api:stateless-v4
  port: 3000
  resources: 
    memory: "128Mi"
    cpu: "128m"
  livenessDelay: 15
  livenessPeriod: 5

# sensetive data for the microservice defined here
secret:
  # dbengine://<service-name>.<service-namespace>.svc.cluster.local:<service-port>  when the service is running in the different cluster
  MONGODB_URI: 'mongodb://mongodb.mongodb.svc.cluster.local:27017/'
